name: Deploy to Production

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build React Frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
          tar -czf ../dist.tar.gz -C ../backend/static/dist .

      - name: Copy Built Frontend to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "dist.tar.gz"
          target: "/home/ubuntu/drivebase/"
          overwrite: true

      - name: Deploy on Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          timeout: 10m
          command_timeout: 10m
          script: |
            set -e
            cd /home/ubuntu/drivebase
            
            echo "=== Pulling latest code ==="
            git fetch --all
            git reset --hard origin/master
            
            echo "=== Extracting Pre-built Frontend ==="
            mkdir -p backend/static/dist backend/staticfiles/dist
            rm -rf backend/staticfiles/dist/*
            
            if [ -f "/home/ubuntu/drivebase/dist.tar.gz" ]; then
              tar -xzf /home/ubuntu/drivebase/dist.tar.gz -C backend/staticfiles/dist/
              cp -r backend/staticfiles/dist/* backend/static/dist/
              rm -f /home/ubuntu/drivebase/dist.tar.gz
            elif [ -f "dist.tar.gz" ]; then
              tar -xzf dist.tar.gz -C backend/staticfiles/dist/
              cp -r backend/staticfiles/dist/* backend/static/dist/
              rm -f dist.tar.gz
            fi
            
            echo "=== Pulling private files ==="
            cd /home/ubuntu/drivebase-private
            git pull
            cp -r pdf_generators/ /home/ubuntu/drivebase/backend/manager/
            
            echo "=== Updating Docker Containers ==="
            cd /home/ubuntu/drivebase
            docker compose up -d --build --remove-orphans
            
            echo "=== Running migrations ==="
            docker compose exec -T django python manage.py migrate --noinput --settings=drivebase.settings_prod
            
            echo "=== Collecting static ==="
            docker compose exec -T django python manage.py collectstatic --noinput --settings=drivebase.settings_prod
            
            echo "=== Deploy complete ==="
