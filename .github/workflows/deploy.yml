name: Deploy to Production

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          timeout: 20m
          command_timeout: 20m
          script: |
            set -e
            APP_DIR=""
            for dir in /home/ubuntu/drivebase /home/ubuntu/acar; do
              if [ -d "$dir" ]; then
                APP_DIR="$dir"
                break
              fi
            done
            if [ -z "$APP_DIR" ]; then
              echo "No deploy directory found (checked: /home/ubuntu/drivebase, /home/ubuntu/acar)"
              exit 1
            fi

            PRIVATE_DIR=""
            for dir in /home/ubuntu/drivebase-private /home/ubuntu/acar-private; do
              if [ -d "$dir" ]; then
                PRIVATE_DIR="$dir"
                break
              fi
            done
            if [ -z "$PRIVATE_DIR" ]; then
              echo "No private directory found (checked: /home/ubuntu/drivebase-private, /home/ubuntu/acar-private)"
              exit 1
            fi
            
            echo "=== Pulling latest code ==="
            cd "$APP_DIR"
            git fetch --all
            git reset --hard origin/master
            
            echo "=== Pulling private files ==="
            cd "$PRIVATE_DIR"
            git pull  # Automatically pulls whatever the default branch is for your private repo
            cp -r pdf_generators/ "$APP_DIR/backend/manager/"
            
            echo "=== Building React frontend ==="
            cd "$APP_DIR/frontend"
            npm ci --prefer-offline
            NODE_OPTIONS=--max-old-space-size=4096 npm run build

            echo "=== Moving Frontend Dist to Staticfiles ==="
            # Remove the old dist folder to prevent junk buildup, then copy the new one over
            rm -rf "$APP_DIR/backend/staticfiles/dist"
            # Copy the newly built folder from where Vite actually put it
            cp -r "$APP_DIR/backend/static/dist" "$APP_DIR/backend/staticfiles/"
            
            echo "=== Rebuilding and Restarting Docker Containers ==="
            cd "$APP_DIR"
            docker compose down
            docker compose up -d --build
            
            echo "=== Running migrations ==="
            docker compose exec -T django python manage.py migrate --noinput --settings=drivebase.settings_prod
            
            echo "=== Collecting static ==="
            docker compose exec -T django python manage.py collectstatic --noinput --settings=drivebase.settings_prod
            
            echo "=== Deploy complete ==="
