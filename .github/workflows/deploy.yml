name: Deploy to Production

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          timeout: 60m
          command_timeout: 60m
          script: |
            set -e
            
            echo "=== Pulling latest code ==="
            cd /home/ubuntu/drivebase
            git fetch --all
            git reset --hard origin/master
            
            echo "=== Pulling private files ==="
            cd /home/ubuntu/drivebase-private
            git pull  # Automatically pulls whatever the default branch is for your private repo
            cp -r pdf_generators/ /home/ubuntu/drivebase/backend/manager/
            
            echo "=== Building React frontend ==="
            cd /home/ubuntu/drivebase/frontend
            npm ci --prefer-offline
            NODE_OPTIONS=--max-old-space-size=4096 npm run build

            echo "=== Moving Frontend Dist to Staticfiles ==="
            # Remove the old dist folder to prevent junk buildup, then copy the new one over
            rm -rf /home/ubuntu/drivebase/backend/staticfiles/dist
            # Copy the newly built folder from where Vite actually put it
            cp -r /home/ubuntu/drivebase/backend/static/dist /home/ubuntu/drivebase/backend/staticfiles/
            
            echo "=== Rebuilding and Restarting Docker Containers ==="
            cd /home/ubuntu/drivebase
            docker compose down
            docker compose up -d --build
            
            echo "=== Running migrations ==="
            docker compose exec -T django python manage.py migrate --noinput --settings=drivebase.settings_prod
            
            echo "=== Collecting static ==="
            docker compose exec -T django python manage.py collectstatic --noinput --settings=drivebase.settings_prod
            
            echo "=== Deploy complete ==="
