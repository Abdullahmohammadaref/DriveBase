name: Deploy to Production

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build React Frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
          tar -czf ../dist.tar.gz -C ../backend/static/dist .

      - name: Copy Built Frontend to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "dist.tar.gz"
          target: "/home/ubuntu/drivebase/"
          overwrite: true

      - name: Deploy on Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          timeout: 15m
          command_timeout: 15m
          script: |
            set -e
            cd /home/ubuntu/drivebase
            
            echo "=== Checking / Configuring Swap on Low-Memory VPS ==="
            if [ $(swapon --show | wc -l) -le 1 ]; then
              echo "Configuring 2GB swapfile to prevent OOM errors..."
              sudo fallocate -l 2G /swapfile 2>/dev/null || sudo dd if=/dev/zero of=/swapfile bs=1M count=2048 2>/dev/null || true
              sudo chmod 600 /swapfile 2>/dev/null || true
              sudo mkswap /swapfile 2>/dev/null || true
              sudo swapon /swapfile 2>/dev/null || true
            else
              echo "Swap is already active."
            fi
            
            echo "=== Pulling latest code ==="
            git fetch --all
            git checkout origin/master -- nginx/nginx.conf 2>/dev/null || true
            git reset --hard origin/master
            
            echo "=== Extracting Pre-built Frontend ==="
            mkdir -p backend/static/dist backend/staticfiles/dist
            rm -rf backend/staticfiles/dist/*
            
            if [ -f "/home/ubuntu/drivebase/dist.tar.gz" ]; then
              tar -xzf /home/ubuntu/drivebase/dist.tar.gz -C backend/staticfiles/dist/
              cp -r backend/staticfiles/dist/* backend/static/dist/
              rm -f /home/ubuntu/drivebase/dist.tar.gz
            elif [ -f "dist.tar.gz" ]; then
              tar -xzf dist.tar.gz -C backend/staticfiles/dist/
              cp -r backend/staticfiles/dist/* backend/static/dist/
              rm -f dist.tar.gz
            fi
            
            echo "=== Pulling private files ==="
            cd /home/ubuntu/drivebase-private
            git pull
            cp -r pdf_generators/ /home/ubuntu/drivebase/backend/manager/
            
            echo "=== Updating Docker Containers ==="
            cd /home/ubuntu/drivebase
            
            # Rebuild image only if Dockerfile or requirements.txt changed, or if image is missing
            if ! docker image inspect drivebase-django:latest >/dev/null 2>&1; then
              echo "Django image not found. Building..."
              docker compose build django
            elif git diff --name-only HEAD@{1} HEAD 2>/dev/null | grep -qE "Dockerfile|backend/requirements.txt"; then
              echo "Dependencies changed. Rebuilding Django image..."
              docker compose build django
            else
              echo "Dependencies unchanged. Skipping slow image rebuild."
            fi
            
            # Free memory caches before running database migrations
            docker builder prune -f 2>/dev/null || true
            docker image prune -f 2>/dev/null || true
            
            echo "=== Running migrations (isolated process) ==="
            docker compose run --rm --no-deps django python manage.py migrate --noinput --settings=drivebase.settings_prod
            
            echo "=== Starting/Reloading Services ==="
            docker compose up -d --remove-orphans
            docker compose restart django
            
            echo "=== Collecting static ==="
            docker compose exec -T django python manage.py collectstatic --noinput --settings=drivebase.settings_prod
            
            echo "=== Reloading Nginx ==="
            docker compose exec -T nginx nginx -s reload 2>/dev/null || true
            
            echo "=== Deploy complete ==="
